# 本地覆盖配置模板：复制为同目录（config/）下的 application-local.yml（已被 .gitignore 忽略，不会提交），按需修改
#   cp config/application-local.example.yml config/application-local.yml
# 以 local profile 启动时生效（IDEA 运行配置已带上：ollama,local / openai,local；命令行加 --spring.profiles.active=ollama,local）
# Spring Boot 默认会加载工作目录下 ./config/ 里的 application-{profile}.yml，所以无需额外配置；工作目录须是仓库根目录
# 这里的内部地址、密钥都只留在你本机，不要写进 src/main/resources

spring:
  ai:
    # —— 用远程 / 共享开发机上的 Ollama（ollama profile）——
    # 远程机器上要让 Ollama 监听外部地址：设置环境变量 OLLAMA_HOST=0.0.0.0:11434 后重启 Ollama
    ollama:
      base-url: http://<ollama-host>:11434
      chat:
        model: qwen2.5:0.5b
      embedding:
        model: bge-m3            # 第 4 章的向量模型：bge-m3（1024 维）或 nomic-embed-text（768 维），先在那台机器上 ollama pull

    # —— 用 OpenAI 兼容接口（openai profile）：取消注释并填写 ——
    # openai:
    #   base-url: https://<your-endpoint>/v1
    #   api-key: <your-api-key>
    #   chat:
    #     model: <model-name>

# —— 第 3 章：商城 mall-evolution 的网关不在本机时 ——
# assistant:
#   mall:
#     base-url: http://<mall-gateway-host>:9000

# —— 第 4 章：知识库用 pgvector（默认 memory 不需要数据库）——
# 先起一个带 pgvector 扩展的 PostgreSQL，如：
#   docker run -d --name mall-pgvector -p 5432:5432 -e POSTGRES_DB=mall_assistant -e POSTGRES_USER=mall -e POSTGRES_PASSWORD=<your-password> pgvector/pgvector:0.8.1-pg17
# 表按向量模型自动生成（knowledge_chunk_bge_m3 / knowledge_chunk_nomic_embed_text），首次入库时自动建表、建 HNSW 索引
# assistant:
#   knowledge:
#     store: pgvector
#     pgvector:
#       url: jdbc:postgresql://<pg-host>:5432/mall_assistant
#       username: mall
#       password: <your-password>

# —— 第 6 章：对话记忆存进 PostgreSQL（默认 memory，重启就没了）——
# 连接默认沿用上面第 4 章 pgvector 的 url / username / password（同一个库，表是 SPRING_AI_CHAT_MEMORY，第一次用到时自动建）；
# 知识库仍用 memory 时也可以只开这一项，pgvector 一段照样要填连接信息
# assistant:
#   memory:
#     store: jdbc

# —— 第 7 章：售后申请单存进 PostgreSQL（默认 memory，重启就没了）——
# 连接默认沿用第 6 章记忆的（也就是上面第 4 章 pgvector 的那个库），表 after_sales_application 第一次用到时自动建
# assistant:
#   after-sales:
#     store: jdbc

# —— 第 8 章：MCP 客户端示例（默认关闭）——
# 本应用去连另一个 MCP Server（Streamable HTTP），白名单里的工具加 ext_ 前缀交给对话模型；GET /api/mcp/client/tools 看连上了哪些。
# 外部工具的说明和结果都是不可信数据：只把信得过、用得着的工具名写进白名单
# spring:
#   ai:
#     mcp:
#       client:
#         enabled: true
#         streamable-http:
#           connections:
#             peer:
#               url: http://<mcp-host>:<port>
#               endpoint: /mcp
# assistant:
#   mcp:
#     client:
#       allowed-tools: [searchKnowledge]
# 确认链接里的地址默认 http://localhost:8088/，换了端口或域名时改这里（MCP 工具返回的 confirmUrl 用它拼）
# assistant:
#   mcp:
#     confirm-url: http://localhost:8088/

# —— 第 9 章：上线保护与监控（默认值见 application.yml 的 assistant.guard / assistant.usage / management）——
# 本机调试时嫌限流碍事可以放宽；生产上按流量和模型服务的能力调，并把 Actuator 放到只有内网能访问的端口
# assistant:
#   guard:
#     requests-per-minute: 60      # 每个调用方每分钟最多问几次
#     max-concurrent: 4            # 同时最多处理几轮（共享开发机上的 Ollama 只有 CPU，一次算不了几个）
#   usage:
#     daily-token-budget: 0        # 每个调用方每天的 Token 上限，0 = 不限；长期开着流量模拟器（README「流量模拟器」）时，默认的 10 万只够它约 3～4 分钟问一次，
#                                  # 想按它配置的约 30 秒一问跑满一天，设成 1000000 或 0
# management:
#   server:
#     port: 9088                   # Actuator（/actuator/prometheus、/actuator/tokens）单独的端口
# 结构化日志（JSON 一行一条，带 traceId / spanId 字段）：设环境变量 LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash，或写在这里
# logging:
#   structured:
#     format:
#       console: logstash

# —— 第 10 章：共享状态放进 Redis（默认 memory，只在一个进程里有效）——
# 限流、并发名额、Token 账、待确认操作、「会话正在回答」标记、归属缓存几个实例共用；和别的系统共用一台 Redis 时选一个没人用的库号（URL 最后一段）
# assistant:
#   state:
#     store: redis
#     on-redis-error: allow        # Redis 挂了时限流与预算：allow 放行 / reject 返回 503；待确认操作一律 503
#     redis:
#       url: redis://:<your-password>@<redis-host>:6379/5
