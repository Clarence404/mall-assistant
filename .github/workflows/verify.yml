# 完整验证并发布测试报告：main 与章节 tag（chNN-start / chNN-done）每次推送都跑 ./mvnw -B verify（Ollama 与 pgvector 集成测试不跳过）
# 报告发布到 gh-pages 分支的 reports/<ref>/，即 https://clarence404.github.io/mall-assistant/reports/<ref>/
# chNN-start 是练习起点，验收测试本来就不通过：照常出报告，但不把这次运行标红
name: verify
on:
  push:
    branches: [main]
    tags: ['ch*']
  workflow_dispatch:
permissions:
  contents: write   # 推送 gh-pages 分支
concurrency:
  group: gh-pages-reports   # 串行发布，避免两个 ref 同时改 gh-pages 根目录
  cancel-in-progress: false
env:
  # OllamaChatIT / OllamaEmbeddingIT 把这个目录挂进容器的 /root/.ollama，模型只在缓存未命中时下载
  OLLAMA_MODELS_CACHE: /home/runner/.cache/mall-assistant/ollama
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 键里写死镜像与模型版本（与 OllamaChatIT、OllamaEmbeddingIT 保持一致），换版本或加模型时同步改这里
      - name: 缓存 Ollama 模型
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mall-assistant/ollama
          key: ollama-0.40.14-qwen2.5-0.5b-nomic-embed-text
      # 第 10 章：告警规则的检查——promtool check config 连带检查规则文件的语法，test rules 跑 alerts.test.yml 里的告警单元测试
      # （PromQL 写错了语法照样对、只是永远不响，只有单元测试查得出来）。用和 monitoring/docker-compose.yml 同一个版本的 Prometheus 镜像
      - name: 校验告警规则（promtool）
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml
      # GitHub 托管的 runner 自带 Docker，Testcontainers 集成测试（Ollama、pgvector、Redis）会真正执行
      - name: 构建与测试
        run: |
          if [[ "$GITHUB_REF_NAME" == *-start ]]; then
            ./mvnw -B verify -Dmaven.test.failure.ignore=true
            echo "### start 标签：测试未通过是预期的" >> "$GITHUB_STEP_SUMMARY"
            echo "这是练习起点，按 docs/ 下的章节说明补全 TODO 后，验收测试才会通过；参考答案见对应的 done 标签。" >> "$GITHUB_STEP_SUMMARY"
          else
            ./mvnw -B verify
          fi
      # 第 9 章：评测门禁。EvalGateTest 在上一步的 verify 里跑：不连模型，回放录下来的 qwen2.5:1.5b 真实输出跑整份评测集
      # （src/test/resources/eval/），和基线比，退化了 verify 就失败；这里把它的报告贴进运行摘要，提交页面上就能看到这次的通过率
      - name: 评测门禁报告
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/eval/report-replay.md ]; then
            cat target/eval/report-replay.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有评测报告：EvalGateTest 没跑到（编译失败或被跳过）" >> "$GITHUB_STEP_SUMMARY"
          fi
      # 容器以 root 写入模型文件，改回 runner 用户，actions/cache 才能打包保存
      - name: 修正模型缓存目录属主
        if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" /home/runner/.cache/mall-assistant || true
      # 测试失败也照样出报告、发布；非 start 标签此时整个 job 仍然记为失败
      - name: 汇总测试报告
        if: ${{ !cancelled() }}
        run: |
          ./mvnw -B -ntp -q surefire-report:report-only surefire-report:failsafe-report-only || true
          bash .github/scripts/collect-reports.sh site "mall-assistant ${{ github.ref_name }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 发布报告到 reports/${{ github.ref_name }}
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: reports/${{ github.ref_name }}
          keep_files: true
      - name: 生成报告首页
        if: ${{ !cancelled() }}
        run: bash .github/scripts/pages-index.sh pages-root "${{ github.ref_name }}"
      - name: 发布报告首页
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages-root
          keep_files: true
