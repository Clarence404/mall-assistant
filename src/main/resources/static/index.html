<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例商城智能客服</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --fg: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --brand: #4f46e5; --brand-fg: #ffffff; --user: #eef2ff; --bot: #ffffff;
    --err-bg: #fef2f2; --err-fg: #b91c1c; --code-bg: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --card: #1f2937; --fg: #e5e7eb; --muted: #9ca3af; --border: #374151;
      --brand: #818cf8; --brand-fg: #111827; --user: #312e81; --bot: #1f2937;
      --err-bg: #3f1d1d; --err-fg: #fca5a5; --code-bg: #111827;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 820px; height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .mode { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .messages {
    flex: 1; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.pending::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
  .msg.error { align-self: stretch; max-width: none; background: var(--err-bg); color: var(--err-fg); font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto 0; }
  @keyframes blink { 50% { opacity: 0; } }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; font: inherit; color: var(--fg);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  textarea:focus { border-color: var(--brand); }
  button {
    height: 44px; padding: 0 20px; border: 0; border-radius: 10px; font: inherit; cursor: pointer;
    background: var(--brand); color: var(--brand-fg);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  details { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .debug { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; margin-top: 8px; }
  .debug section h3 { font-size: 13px; margin: 4px 0; }
  .debug dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
  .debug dt { color: var(--muted); }
  .debug dd { margin: 0; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .placeholder { color: var(--muted); }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .login { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; justify-content: flex-end; }
  .login input {
    width: 120px; height: 30px; padding: 0 8px; font: inherit; color: var(--fg);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .login button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; }
  .login .ok { color: var(--fg); }
  .login .err { color: var(--err-fg); }
  .tools { margin: 0; padding-left: 18px; font-family: ui-monospace, Consolas, monospace; }
  .tools li { margin: 2px 0 6px; word-break: break-all; }
  .tools .meta { color: var(--muted); }
  .debug section.wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>示例商城智能客服</h1>
      <div class="sub">商品、下单、支付、物流、售后，都可以问我</div>
    </div>
    <div class="head-right">
      <!-- 第 3 章：登录商城账号（经 POST /api/mall/login 转给 mall-evolution），之后提问时带上 Authorization: Bearer <令牌> -->
      <form class="login" id="loginForm" autocomplete="off">
        <span id="loginState">未登录</span>
        <input id="phone" placeholder="手机号" value="13800000000" aria-label="手机号">
        <input id="password" type="password" placeholder="密码（演示 mall123）" aria-label="密码">
        <button type="submit" id="loginBtn">登录</button>
        <button type="button" id="logoutBtn" hidden>退出</button>
      </form>
      <label class="mode"><input type="checkbox" id="streamMode" checked> 流式输出</label>
    </div>
  </header>

  <main class="messages" id="messages" aria-live="polite">
    <p class="hint" id="hint">你好，我是示例商城客服，有什么可以帮你？</p>
  </main>

  <form id="chatForm">
    <textarea id="input" rows="1" maxlength="2000" placeholder="输入问题，Enter 发送，Shift + Enter 换行" required></textarea>
    <button type="submit" id="send">发送</button>
  </form>

  <details id="debugPanel">
    <summary>调试面板</summary>
    <div class="debug">
      <section>
        <h3>本次请求</h3>
        <dl>
          <dt>接口</dt><dd id="dbgEndpoint">-</dd>
          <dt>状态</dt><dd id="dbgStatus">-</dd>
          <dt>首段耗时</dt><dd id="dbgFirst">-</dd>
          <dt>总耗时</dt><dd id="dbgTotal">-</dd>
          <dt>片段数</dt><dd id="dbgChunks">-</dd>
          <dt>错误码</dt><dd id="dbgError">-</dd>
        </dl>
      </section>
      <section>
        <h3>意图识别</h3>
        <dl>
          <dt>意图</dt><dd id="dbgIntent">-</dd>
          <dt>把握</dt><dd id="dbgConfidence">-</dd>
          <dt>订单号</dt><dd id="dbgOrderNo">-</dd>
          <dt>SKU</dt><dd id="dbgSku">-</dd>
        </dl>
      </section>
      <section class="wide">
        <h3>工具调用</h3>
        <ol class="tools" id="dbgTools"><li class="placeholder">-</li></ol>
      </section>
      <section>
        <h3>引用来源</h3>
        <p class="placeholder">第 5 章接入 RAG 后，这里显示回答引用的知识片段。</p>
      </section>
      <section>
        <h3>Token 用量</h3>
        <p class="placeholder">第 9 章评估与上线时，这里显示输入 / 输出 token 数。</p>
      </section>
    </div>
  </details>
</div>

<script>
// 聊天页：原生 JS，无构建步骤。两种模式（右上角切换）：
//   阻塞 —— POST /api/chat，等完整回答一次显示；流式 —— POST /api/chat/stream，按 SSE 事件逐段追加到气泡里
// 底部「调试面板」显示接口、状态、首段 / 总耗时、片段数、错误码，以及识别出的意图（第 2 章）、调用过的工具（第 3 章）
// 第 3 章：右上角登录商城账号，令牌存在 sessionStorage（关掉标签页就没了），提问时放进 Authorization 请求头；
//   令牌只给后端的工具用，后端不会把它发给模型
(() => {
  const $ = (id) => document.getElementById(id);
  const messages = $('messages');
  const form = $('chatForm');
  const input = $('input');
  const send = $('send');
  const streamMode = $('streamMode');

  // 追加一个消息气泡（kind：user / bot / error，可带 pending 显示闪烁光标），返回元素以便流式时继续往里写字
  function addMessage(kind, text) {
    $('hint')?.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  // 更新调试面板：传入 { 字段名: 显示值 }，只改传了的字段
  function debug(values) {
    const map = {
      endpoint: 'dbgEndpoint', status: 'dbgStatus', first: 'dbgFirst', total: 'dbgTotal', chunks: 'dbgChunks', error: 'dbgError',
      intent: 'dbgIntent', confidence: 'dbgConfidence', orderNo: 'dbgOrderNo', sku: 'dbgSku'
    };
    for (const [k, v] of Object.entries(values)) $(map[k]).textContent = v;
  }

  // 第 2 章：先识别出的意图。阻塞接口在响应体的 intent 字段里，流式接口是最先推送的 intent 事件
  const INTENT_LABELS = {
    ORDER_STATUS: '查订单', PRODUCT_INFO: '问商品', AFTER_SALES: '售后',
    CHITCHAT: '闲聊', OUT_OF_SCOPE: '超出范围，直接拒答', UNKNOWN: '未识别'
  };

  function showIntent(r) {
    if (!r) return;
    debug({
      intent: r.intent + (INTENT_LABELS[r.intent] ? '（' + INTENT_LABELS[r.intent] + '）' : ''),
      confidence: typeof r.confidence === 'number' ? r.confidence.toFixed(2) : '-',
      orderNo: r.orderNo || '-',
      sku: r.skuId || '-'
    });
  }

  // 第 3 章：商城令牌。sessionStorage 在隐私模式或被禁用时会抛异常，读写都包一层，失败就只存在内存里
  const TOKEN_KEY = 'mallToken';
  const PHONE_KEY = 'mallPhone';
  let mallToken = null;
  try { mallToken = sessionStorage.getItem(TOKEN_KEY); } catch { /* 存不了就算了 */ }

  function saveLogin(token, phone) {
    mallToken = token;
    try {
      if (token) { sessionStorage.setItem(TOKEN_KEY, token); sessionStorage.setItem(PHONE_KEY, phone); }
      else { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(PHONE_KEY); }
    } catch { /* 同上 */ }
    renderLogin();
  }

  function renderLogin(error) {
    let phone = '';
    try { phone = sessionStorage.getItem(PHONE_KEY) || ''; } catch { /* 同上 */ }
    const state = $('loginState');
    state.className = error ? 'err' : (mallToken ? 'ok' : '');
    state.textContent = error || (mallToken ? '已登录 ' + phone.replace(/^(\d{3})\d{4}(\d+)$/, '$1****$2') : '未登录');
    $('phone').hidden = $('password').hidden = $('loginBtn').hidden = !!mallToken;
    $('logoutBtn').hidden = !mallToken;
  }

  // 登录：经智能客服的 /api/mall/login 转给商城网关，页面不直接调 9000（免跨域）
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = $('phone').value.trim();
    const password = $('password').value;
    if (!phone || !password) { renderLogin('请输入手机号和密码'); return; }
    try {
      const res = await fetch('/api/mall/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password })
      });
      if (!res.ok) { renderLogin((await problemMessage(res)).message); return; }
      const body = await res.json();
      $('password').value = '';
      saveLogin(body.accessToken, phone);
    } catch {
      renderLogin('登录失败：网络异常');
    }
  });
  $('logoutBtn').addEventListener('click', () => saveLogin(null));

  // 提问时的请求头：登录了就带上 Authorization: Bearer <商城令牌>
  function authHeaders(headers) {
    return mallToken ? { ...headers, 'Authorization': 'Bearer ' + mallToken } : headers;
  }

  // 第 3 章：工具调用记录（阻塞接口在响应体的 tools 字段里，流式接口是 tool 事件）
  const SOURCE_LABELS = { MODEL: '模型决定调用', DIRECT: '按意图直接查询' };

  function resetTools() {
    $('dbgTools').innerHTML = '<li class="placeholder">-</li>';
  }

  function addTool(t) {
    const list = $('dbgTools');
    list.querySelector('.placeholder')?.remove();
    const li = document.createElement('li');
    const result = t.result && t.result.length > 300 ? t.result.slice(0, 300) + '…' : t.result;
    li.textContent = t.name + ' ' + t.arguments + ' → ' + result;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (SOURCE_LABELS[t.source] || t.source) + '，' + t.durationMs + ' ms';
    li.appendChild(meta);
    list.appendChild(li);
  }

  // 非 2xx 时尽量读出 ProblemDetail 的 detail，读不出就给通用提示
  async function problemMessage(res) {
    try {
      const body = await res.json();
      return { code: body.code || 'HTTP_' + res.status, message: body.detail || body.title || '请求失败' };
    } catch {
      return { code: 'HTTP_' + res.status, message: '请求失败（HTTP ' + res.status + '）' };
    }
  }

  // 阻塞模式：一次请求拿到 { reply, intent }；非 2xx 时抛出 { code, message }，由 submit() 统一显示
  async function askBlocking(text, bubble, t0) {
    debug({ endpoint: 'POST /api/chat' });
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json', 'Accept': 'application/json' }),
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) throw await problemMessage(res);
    const body = await res.json();
    showIntent(body.intent);
    (body.tools || []).forEach(addTool);
    bubble.textContent = body.reply;
    debug({ status: 'done', first: '-', chunks: '1', total: (performance.now() - t0).toFixed(0) + ' ms' });
  }

  // POST + fetch 读 text/event-stream：EventSource 只支持 GET，消息放请求体更合适
  // 做法：res.body 是字节流（ReadableStream），经 TextDecoderStream 解码成文本后逐块 read()；
  // 一块不一定正好是一条完整事件，所以先攒进 buffer，遇到空行（连续两个换行）再切出一条解析
  // 结束判定：收到 done 正常结束；收到 error 抛出错误（服务端已经回了 200，错误只能作为事件到达）；
  // 连接关了却两者都没收到，说明中途断开，报 STREAM_INTERRUPTED
  async function askStreaming(text, bubble, t0) {
    debug({ endpoint: 'POST /api/chat/stream' });
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json', 'Accept': 'text/event-stream' }),
      body: JSON.stringify({ message: text })
    });
    if (!res.ok) throw await problemMessage(res);

    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    let chunks = 0;
    let finished = false;

    // 按事件名分发，事件定义见后端的 StreamEvents；data 都是 JSON
    const handle = (event, data) => {
      if (event === 'intent') {
        showIntent(JSON.parse(data));
      } else if (event === 'tool') {
        addTool(JSON.parse(data));
      } else if (event === 'token') {
        if (chunks === 0) debug({ first: (performance.now() - t0).toFixed(0) + ' ms' });
        chunks++;
        bubble.textContent += JSON.parse(data).text;
        messages.scrollTop = messages.scrollHeight;
        debug({ chunks: String(chunks), status: 'streaming' });
      } else if (event === 'done') {
        finished = true;
        debug({ status: 'done' });
      } else if (event === 'error') {
        finished = true;
        throw JSON.parse(data);
      }
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value.replace(/\r\n/g, '\n');
      let sep;
      // 一条 SSE 以空行结束；按行解析 event: 与 data:
      while ((sep = buffer.indexOf('\n\n')) >= 0) {
        const raw = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);
        let event = 'message';
        const data = [];
        for (const line of raw.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
        }
        if (data.length) handle(event, data.join('\n'));
      }
    }
    debug({ total: (performance.now() - t0).toFixed(0) + ' ms' });
    if (!finished) throw { code: 'STREAM_INTERRUPTED', message: '连接意外中断，请重试。' };
  }

  // 发送一条消息：显示用户气泡与空的回答气泡，按模式调用接口；任何错误（ProblemDetail、error 事件、网络异常）都在这里统一展示
  async function submit() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    autosize();
    addMessage('user', text);
    const bubble = addMessage('bot pending', '');
    send.disabled = true;
    debug({ status: 'waiting', first: '-', total: '-', chunks: '0', error: '-', intent: '-', confidence: '-', orderNo: '-', sku: '-' });
    resetTools();
    const t0 = performance.now();
    try {
      if (streamMode.checked) await askStreaming(text, bubble, t0);
      else await askBlocking(text, bubble, t0);
    } catch (e) {
      const err = (e && e.code) ? e :{ code: 'NETWORK_ERROR', message: '网络异常，请检查服务是否启动。' };
      if (!bubble.textContent) bubble.remove();
      addMessage('error', err.message);
      debug({ status: 'error', error: err.code || '-', total: (performance.now() - t0).toFixed(0) + ' ms' });
    } finally {
      bubble.classList.remove('pending');
      send.disabled = false;
      input.focus();
    }
  }

  // 输入框随内容自动增高，最多 160px
  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  renderLogin();
  form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!send.disabled) submit(); }
  });
  input.focus();
})();
</script>
</body>
</html>
