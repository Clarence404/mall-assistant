# 公共配置；模型厂商按 profile 切换：默认 ollama（本机 Ollama），可选 openai（任意 OpenAI 兼容接口）
# 另有 claude-cli / codex-cli 两个可选 profile（用本机命令行工具当模型），见 application-claude-cli.yml / application-codex-cli.yml
# 任何一项都可以用环境变量覆盖（Spring Boot 宽松绑定：全大写，点和连字符换成下划线），
# 如 ASSISTANT_PROMPT_VERSION=v1、SPRING_AI_RETRY_MAX_ATTEMPTS=0、SPRING_PROFILES_ACTIVE=openai
spring:
  application:
    name: mall-assistant
  profiles:
    default: ollama          # 没指定 spring.profiles.active 时启用的 profile；指定了（如 openai,local）就不再用它
  threads:
    virtual:
      enabled: true          # 请求跑在虚拟线程上：调模型动辄等几秒到几十秒，线程大部分时间在干等，虚拟线程让「等」几乎不占资源
  mvc:
    problemdetails:
      enabled: true          # 参数校验失败等 MVC 自带异常也返回 ProblemDetail
    async:
      request-timeout: 3m    # 流式接口整体最长时长，兜底
  http:
    clients:                 # 作用于自动配置的 RestClient（阻塞调用）与 WebClient（流式调用）
      connect-timeout: 3s    # 建立连接最多等多久：模型服务没启动时快速失败（MODEL_UNAVAILABLE），不让用户干等
      read-timeout: 60s      # 阻塞调用要等整段回答生成完，给足时间；流式调用是两段之间的间隔
      # 注意：openai profile 走 OpenAI 官方 Java SDK，不用这里的设置，超时与重试见 application-openai.yml
  ai:
    model:                   # 用不到的模型能力关掉，免得 openai Starter 要求配置 api-key
      # embedding（向量模型，第 4 章知识入库用）和 chat 一样不在这里写，由各 profile 的 yml 指定：
      # ollama profile 用 Ollama，openai profile 用 OpenAI 兼容接口，claude-cli / codex-cli 没有向量模型、也用 Ollama
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      # chat（用哪家的对话模型）不在这里写，由各 profile 的 yml 指定：ollama / openai / none（命令行模型）
    tools:                   # Spring AI 自己的工具调用设置（第 3 章）；本项目的开关在下面的 assistant.tools
      limits:                # 一轮回答里最多调几次工具：防止模型反复调同一个工具停不下来（循环失控）
        max-total-tool-calls: 4          # 所有工具合计（默认 150）
        max-calls-per-tool-default: 2    # 单个工具（默认 40）
        on-limit-exceeded: return-error-response   # 超了不抛异常，而是告诉模型「超过次数了」，让它用已有结果回答
    retry:                   # 默认会重试 10 次、指数退避，模型挂了要等好几分钟才报错；客服场景快速失败
      # Spring AI 2.0 把这个值当作「失败后再重试几次」（交给 RetryPolicy.maxRetries），1 = 最多共调 2 次；改成 0 就完全不重试。
      # 只对 Ollama 的阻塞调用生效（流式调用不经过它），重试连接失败（ResourceAccessException）和厂商返回的临时性错误
      # （TransientAiException，如 HTTP 5xx）；4xx（参数错、模型不存在）默认不重试
      max-attempts: 1
      backoff:
        initial-interval: 500ms   # 第一次重试前等多久（默认 2 秒）
        max-interval: 2s          # 指数退避的等待上限（默认 3 分钟）

# 本项目自己的配置，分别绑定到 ChatProperties（assistant.chat）、PromptProperties（assistant.prompt）、
# ToolProperties（assistant.tools）、MallApiProperties（assistant.mall）与 KnowledgeProperties（assistant.knowledge）
assistant:
  chat:
    stream-timeout: 30s      # 流式：首段和相邻两段之间最多等多久
    refuse-min-confidence: 0.6   # 意图为 OUT_OF_SCOPE 且把握不低于它才直接拒答（不调回答模型）
  tools:                     # 第 3 章：怎么让模型用上商城数据（见 ToolProperties）
    native-calling: true     # 把工具注册给模型，由模型决定调不调（ollama / openai 支持；命令行模型的 profile 里改成 false）
    direct-lookup: true      # 意图识别抽到了订单号 / SKU 时，代码直接查询，把结果作为「查询结果」放进提示词
  mall:                      # 第 3 章：商城 mall-evolution 的网关（见 MallApiProperties）
    base-url: ${MALL_API_BASE_URL:http://localhost:9000}   # 先按 mall-evolution 的 README 启动四个服务；连别的机器写进 application-local.yml
    connect-timeout: 2s      # 网关没启动时快速失败，工具返回「商城服务暂时不可用」
    read-timeout: 5s         # 商城接口正常几十毫秒返回，比调模型的超时短得多
  prompt:
    version: v3              # 系统提示词版本：prompts/system-v3.st（第 3 章：订单、商品信息只能来自查询结果）；改回 v2 / v1 可对比效果
    shop-name: 示例商城      # 以下三项是模板变量 {shopName} / {assistantName} / {supportScope}，同时用于系统提示词与拒答话术
    assistant-name: 小示
    support-scope: 商品、下单、支付、物流、退换货与售后、账户与积分
    zone: Asia/Shanghai      # 渲染「今天」用的时区
  knowledge:                 # 第 4 章：知识入库（见 KnowledgeProperties）。只做入库与检索调试，第 5 章 RAG 才接进对话
    store: ${ASSISTANT_KNOWLEDGE_STORE:memory}   # 向量库：memory（默认，不装数据库也能跑）或 pgvector（PostgreSQL + pgvector 扩展）
    location: classpath:knowledge/*.md           # 知识文档在哪；也可以写 file:/某个目录/*.md
    ingest-on-startup: true  # 启动后自动增量入库一次；向量模型或向量库不可用时只打警告，不影响启动和对话
    # embedding-model（当前向量模型的名字）由各 profile 的 yml 从对应厂商的配置引用过来，用来选前缀、给表名 / 文件名加后缀
    dimensions: 0            # 向量维度：0 = 第一次用到时调一次模型探测（bge-m3 是 1024、nomic-embed-text 是 768），大于 0 = 按配置
    chunk:                   # 切块：先按标题分节，超长的节再按长度切
      max-chars: 300         # 每块正文最多多少个字符：太大一块里混了好几件事、检索不准，太小丢上下文；规则文档一节一两百字，一节一块
      overlap: 50            # 相邻两块重叠多少个字符：按长度硬切时句子可能被切断，重叠让跨边界的内容在两块里都完整出现
    search:                  # 相似度检索（GET /api/knowledge/search）
      default-top-k: 4       # 不传 topK 时返回几块
      max-top-k: 10          # topK 上限
    memory:                  # store=memory 时
      dir: target/knowledge  # 入库后把向量存成 JSON（knowledge_chunk_<模型>.json），重启后读回来、没变的文档直接跳过；留空 = 不持久化
    pgvector:                # store=pgvector 时（见 PgVectorConfig）；真实地址和密码写进不入库的 config/application-local.yml 或环境变量
      url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/mall_assistant}
      username: ${PGVECTOR_USERNAME:mall}
      password: ${PGVECTOR_PASSWORD:}
      schema: public
      table: ""              # 留空 = 按模型生成表名（knowledge_chunk_bge_m3 / knowledge_chunk_nomic_embed_text），不同模型各用一张表
      initialize-schema: true   # 自动建扩展、建表、建 HNSW 索引（都是 IF NOT EXISTS，已存在不动）
      max-pool-size: 4       # 连接池大小，入库和检索都是偶尔调用
    model-profiles:          # 按模型名前缀匹配的「查询前缀 / 文档前缀」，前缀只在调模型时加，不存进库里
      - match: nomic-embed-text            # nomic 官方要求：检索的问题加 search_query: ，入库的文档加 search_document:
        query-prefix: "search_query: "
        document-prefix: "search_document: "
      - match: bge-m3                      # bge-m3 不需要前缀（列在这里只是说明，不写效果一样）
        query-prefix: ""
        document-prefix: ""
  rag:                       # 第 5 章：检索增强回答（见 RagProperties）。检索 → 把编了号的资料拼进提示词 → 模型只依据资料回答并标注 [n]
    enabled: true            # 总开关；关掉后规则类问题按普通问答回答（模型只能凭常识，容易编）
    intents:                 # 哪些意图走 RAG：售后、规则政策（答案在规则文档里）；查订单 / 商品仍走第 3 章的工具
      - AFTER_SALES
      - POLICY
    top-k: 4                 # 最终交给模型几块资料（编号 [1]～[4]）：太少容易漏答案，太多提示词变长、小模型容易被无关内容带偏
    candidate-k: 10          # 向量检索、关键词检索各取几块候选再融合（不超过 assistant.knowledge.search.max-top-k）
    min-score: 0.6           # 向量检索的最低余弦相似度，低于它不算相关。按 bge-m3 实测定的（评测集正确答案 0.67～0.81，知识库里没有的问题多在 0.49～0.64），换模型要重新测（见 docs/ch05.md）
    keyword-min-coverage: 0.6  # 关键词检索找到的块：问题里的词（去掉「的、了、吗」等）至少六成出现在块里才算相关
    context-budget-chars: 1500 # 拼进提示词的资料最多多少字（上下文窗口预算），放不下的块不放
    hybrid: true             # 混合检索：关键词检索（BM25）+ 向量检索，RRF 融合；false = 只用向量检索，用来对比
    rrf-k: 60                # RRF 平滑常数：第 r 名得 1 / (60 + r) 分
    rewrite-query: false     # 检索前先让对话模型改写问题（Spring AI RewriteQueryTransformer）；多一次模型调用，默认关
    snippet-chars: 80        # 引用来源的片段长度（页面悬停提示用）
    prompt: rag-v1           # RAG 回答的系统提示词：prompts/rag-v1.st

server:
  port: ${SERVER_PORT:8088}    # 与 mall-evolution（8080 / 8082 / 8083 / 9000）错开，两个项目可以同时运行
  error:
    include-stacktrace: never  # Spring Boot 默认错误页 / 错误 JSON 里不带堆栈和异常信息，避免把内部细节漏给用户
    include-message: never
