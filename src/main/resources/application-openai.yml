# 可选 profile：任意 OpenAI 兼容接口（OpenAI、DeepSeek、通义千问兼容模式、vLLM、Ollama 的 /v1……）
# 用法：提供 OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL 三个值后以 openai profile 启动
#   - 方式一：环境变量（IDEA 运行配置「智能客服（OpenAI 兼容接口）」里已列出，填上即可）
#   - 方式二：复制 application-local.example.yml 为 application-local.yml（不入库），直接写 spring.ai.openai.* 三项，
#     再加上 local profile（IDEA 运行配置已带 local）；它的优先级更高，环境变量留空也不影响
# 密钥只放这两处，不写进仓库
spring:
  ai:
    model:
      chat: openai           # 选用 OpenAI 的 ChatModel 自动配置（OpenAiChatModel）；业务代码不用改，只换了 ChatClient 背后的模型
    openai:
      base-url: ${OPENAI_BASE_URL}     # 含 /v1，例如 https://api.deepseek.com/v1、http://localhost:11434/v1
      api-key: ${OPENAI_API_KEY}
      # Spring AI 2.0 的 openai 走 OpenAI 官方 Java SDK，不用 application.yml 里的 spring.http.clients 与 spring.ai.retry，
      # 超时和重试在这里单独设
      timeout: 60s           # 单次请求超时，与 application.yml 的 read-timeout 保持一致
      max-retries: 1         # SDK 默认重试 3 次；和 spring.ai.retry 一样，客服场景快速失败
      chat:
        model: ${OPENAI_MODEL}
        temperature: 0.3     # 同 ollama：回答的默认温度，意图识别在代码里单独设为 0
