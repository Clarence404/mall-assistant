# 第 10 章：Grafana 启动时自动建好 Prometheus 数据源（provisioning），不用在页面上手点。
# uid 固定为 prometheus：面板 JSON 里的数据源是一个模板变量（${datasource}），选的就是它
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy                 # Grafana 服务端去查（浏览器不直接连 Prometheus）
    url: http://prometheus:9090   # 同一个 compose 网络里的服务名
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s           # 和抓取间隔一致：$__rate_interval 至少取 4 倍，rate() 才不会算出空值
